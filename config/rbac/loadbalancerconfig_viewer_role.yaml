# This rule is not used by the project bootc-load-balancer-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to config.bootc-lb.syn.tools resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: bootc-load-balancer-controller
    app.kubernetes.io/managed-by: kustomize
  name: loadbalancerconfig-viewer-role
rules:
- apiGroups:
  - config.bootc-lb.syn.tools
  resources:
  - loadbalancerconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - config.bootc-lb.syn.tools
  resources:
  - loadbalancerconfigs/status
  verbs:
  - get
